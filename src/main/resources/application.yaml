spring:
  application:
    name: field-reserve-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/field_reserve
    username: postgres
    password: 12345678
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # el esquema lo crea bd.sql
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Lima
  jackson:
    time-zone: America/Lima

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration-seconds: 28800
  bootstrap:
    admin-password: ${ADMIN_PASSWORD:Admin12345}
  reserva:
    adelanto-porcentaje: 0.50

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
